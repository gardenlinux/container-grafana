name: Build FIPS Grafana image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 13.2.4)'
        required: false
        default: '13.2.4'

permissions:
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 image
        env:
          VERSION: ${{ github.event.inputs.version || '13.2.4' }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gl-fips-grafana
        run: |
          bash build-grafana-fips.sh
          docker push ghcr.io/${{ github.repository_owner }}/gl-fips-grafana:${VERSION}-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push arm64 image
        env:
          VERSION: ${{ github.event.inputs.version || '13.2.4' }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gl-fips-grafana
        run: |
          bash build-grafana-fips.sh
          docker push ghcr.io/${{ github.repository_owner }}/gl-fips-grafana:${VERSION}-arm64

  push-manifest:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        env:
          VERSION: ${{ github.event.inputs.version || '13.2.4' }}
        run: |
          docker manifest create \
            ghcr.io/${{ github.repository_owner }}/gl-fips-grafana:${VERSION} \
            ghcr.io/${{ github.repository_owner }}/gl-fips-grafana:${VERSION}-amd64 \
            ghcr.io/${{ github.repository_owner }}/gl-fips-grafana:${VERSION}-arm64
          docker manifest push ghcr.io/${{ github.repository_owner }}/gl-fips-grafana:${VERSION}
